name: Publicar instaladores
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mapa-cto-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validar versão e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "VERSION=\"$version\"" installers/install.sh
          bash -n installers/install.sh
          php -l addons/mapa-cto/src/cto/componente/maps/controller.php
          php -l addons/mapa-cto/src/cto/componente/maps/maps.view.php
          php -l addons/mapa-cto/src/cto/componente/maps/totals_permission.php
          node tests/test-client-totals-filters.js
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Gerar pacotes
        shell: pwsh
        run: ./installers/build-release.ps1 -Version $env:RELEASE_VERSION
      - name: Conferir conteúdo e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          name="mkauth-mapa-cto-$RELEASE_VERSION"
          (cd dist && sha256sum -c "$name.run.sha256" "$name.tar.gz.sha256")
          tar -tzf "dist/$name.tar.gz" | grep -Fx "$name/addons/mapa-cto/src/cto/componente/maps/totals_permission.php"
          awk 'found {print} /^__ARCHIVE_BELOW__$/ {found=1}' "dist/$name.run" > dist/embedded.tar.gz
          cmp "dist/$name.tar.gz" dist/embedded.tar.gz
          cat > dist/notes.md <<'NOTES'
          O mapa de clientes respeita a permissão Clientes → Totais (`perm_numClientes`). Sem autorização, oculta Total, Online e Offline, mantendo marcadores e filtros funcionando.

          Validado no Visual Net com backup: sintaxe PHP, hashes, permissão ativada/desativada/ausente, identidades atual e legada, renderização sintética e filtros JavaScript. Os testes SQL usam uma tabela temporária e não alteram clientes reais.

          A regra controla a exibição dos contadores. A lista de clientes enviada ao navegador continua disponível para o mapa.

          Para instalar, salve o arquivo `.run` no servidor MK-AUTH, confira o SHA256 e execute com `sh`. Não use `curl | bash`.
          NOTES
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release já existe; publicação preservada."
            exit 0
          fi
          gh release create "v$RELEASE_VERSION" "dist/$name.run" "dist/$name.run.sha256" "dist/$name.tar.gz" "dist/$name.tar.gz.sha256" --target "$GITHUB_SHA" --title "Mapa CTO v$RELEASE_VERSION" --notes-file dist/notes.md --draft
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
